<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src https://fonts.googleapis.com 'sha256-ILYNnGGgA6/+fKJ+BzFra/9rhtO7qwyWgy6brRjjgj0='; font-src https://fonts.gstatic.com; img-src 'self'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>404 · Salai Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=M+PLUS+Rounded+1c:wght@800;900&display=swap">
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem 1rem;
  background: radial-gradient(56% 46% at 68% 80%, rgba(245, 185, 68, 0.2), transparent 70%), linear-gradient(180deg, #060a1f 0%, #121844 55%, #2a2262 100%);
  background-attachment: fixed; color: #f6f5ff;
  font: 400 1rem/1.55 "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
}
main { width: min(100%, 34rem); text-align: center; }
.brand { display: inline-block; margin-bottom: 2.5rem; font: 900 1.2rem/1 "M PLUS Rounded 1c", "Geist", system-ui, sans-serif; letter-spacing: 0.06em; color: #f6f5ff; text-decoration: none; }
.code { display: block; font: 900 clamp(4.5rem, 18vw, 7rem)/1 "M PLUS Rounded 1c", "Geist", system-ui, sans-serif; color: #a99dff; text-shadow: 0 3px 0 #4a39c2, 0 6px 0 #352c7c, 0 14px 30px rgba(3, 5, 20, 0.55); letter-spacing: 0.02em; }
h1 { margin: 1rem 0 0.35rem; font: 800 clamp(1.4rem, 4vw, 1.9rem)/1.2 "M PLUS Rounded 1c", "Geist", system-ui, sans-serif; }
p { margin: 0; color: #c3c2e6; }
.en { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, 0.22); }
.en h1 { margin-top: 0; }
.btn { position: relative; display: inline-block; min-width: 13rem; margin-top: 2rem; padding-bottom: 8px; text-decoration: none; }
.btn::after { content: ""; position: absolute; left: 0; right: 0; top: 10px; bottom: 0; border-radius: 16px; background: #b97f1c; }
.face { position: relative; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.2em 0.6em; min-height: 56px; padding: 0.6rem 1.5rem 0.65rem; border-radius: 16px; background: #f5b944; color: #1b1b22; font: 800 1.1rem/1.1 "M PLUS Rounded 1c", "Geist", system-ui, sans-serif; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; transition: transform 0.12s; }
.btn:hover .face { transform: translateY(-3px); }
.btn:active .face { transform: translateY(6px); }
.btn:focus-visible { outline: 3px solid #f6f5ff; outline-offset: 4px; border-radius: 16px; }
@media (max-width: 520px) { .btn { width: 100%; min-width: 0; } .sep { display: none; } }
</style>
</head>
<body>
<main>
<a class="brand" href="/">SALAI STUDIO</a>
<span class="code" aria-hidden="true">404</span>
<section lang="es">
<h1>Esta isla no existe</h1>
<p>La página que buscas no está aquí, o cambió de lugar.</p>
</section>
<section class="en" lang="en">
<h1>This island does not exist</h1>
<p>The page you are looking for is not here, or it moved.</p>
</section>
<a class="btn" href="/"><span class="face"><span lang="es">Volver al inicio</span><span class="sep" aria-hidden="true">·</span><span lang="en">Back home</span></span></a>
</main>
</body>
</html>
